swing:
  # ML prediction target: 1-day forward direction and return
  horizon_days: 1
  direction_threshold: 0.0
  min_history_days: 63

  # 1:2 risk-reward trade management
  # Stop loss = entry_price - (stop_atr_multiplier x ATR_14)
  # Take profit = entry_price + (target_atr_multiplier x ATR_14)
  stop_atr_multiplier: 1.0
  target_atr_multiplier: 2.0
  max_hold_days: 5          # Maximum swing hold before timeout exit

  drop_rows_with_missing_features: true

features:
  returns_windows: [1, 5, 10, 21, 63]
  volatility_windows: [10, 21]
  rsi_window: 14
  atr_window: 14            # ATR window used for R:R stop and target sizing
