name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy code to EC2 via SSM
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Run Deployment via SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-004ede57a842280fe" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"cd /home/ec2-user/project-intelligent || git clone https://github.com/biteberry/project-intelligent.git /home/ec2-user/project-intelligent\",
              \"cd /home/ec2-user/project-intelligent\",
              \"git fetch origin main\",
              \"git reset --hard origin/main\",
              \"pip3 install -r requirements.txt\"
            ]" \
            --timeout-seconds 600 \
            --region ap-south-1
