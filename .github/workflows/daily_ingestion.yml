name: Daily Data Ingestion Pipeline

on:
  # Run automatically every weekday at 6:30 PM IST (13:00 UTC)
  # Indian markets close at 3:30 PM IST, Bhav Copies are usually published by 6:00 PM IST.
  schedule:
    - cron: '0 13 * * 1-5'
    
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  run-ingestion:
    name: Run J01 and J02 on EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Execute Pipeline via AWS SSM
        run: |
          # Dispatch the SSM Command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-004ede57a842280fe" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"set -e\",
              \"cd /home/ec2-user/project-intelligent\",
              \"git fetch origin main\",
              \"git reset --hard origin/main\",
              \"pip3 install --user -r requirements.txt\",
              \"echo 'Starting J01 (Yahoo Finance OHLCV)'\",
              \"python3 src/ingestion/j01_ohlcv_daily.py\",
              \"echo 'Starting J02 (NSE Delivery Pct)'\",
              \"python3 src/ingestion/j02_delivery_pct_daily.py\",
              \"echo 'Starting J09 (Finnhub Sentiment)'\",
              \"python3 src/ingestion/j09_sentiment_daily.py\",
              \"echo 'Starting J11 (Silver Transformation)'\",
              \"python3 src/silver/j11_silver_transformation.py\"
            ]" \
            --timeout-seconds 900 \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
            
          echo "Dispatched SSM Command: $COMMAND_ID"
          
          # Wait for the command to finish executing
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-004ede57a842280fe" \
            --region ap-south-1
            
          # Fetch the final status to ensure it passed
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-004ede57a842280fe" \
            --region ap-south-1 \
            --query "Status" \
            --output text)
            
          if [ "$STATUS" != "Success" ]; then
            echo "Pipeline failed with status: $STATUS"
            # Print the error logs for debugging
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-004ede57a842280fe" \
              --region ap-south-1 \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          
          echo "Pipeline executed successfully!"
