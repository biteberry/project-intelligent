name: Daily Data Ingestion Pipeline

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  bronze_ingestion:
    name: Run Bronze Ingestion (Node A - t2.micro)
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: J01 - Yahoo Finance OHLCV
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "i-004ede57a842280fe" --document-name "AWS-RunShellScript" --parameters commands="[\"cd /home/ec2-user/project-intelligent\",\"git pull\",\"python3 src/ingestion/j01_ohlcv_daily.py\"]" --timeout-seconds 900 --region ap-south-1 --query "Command.CommandId" --output text)
          
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardOutputContent" --output text
              break
            fi
            if [[ "$STATUS" == "Failed" || "$STATUS" == "DeliveryTimedOut" || "$STATUS" == "ExecutionTimedOut" ]]; then
              echo "--- STDERR ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 15
          done

      - name: J02 - NSE Delivery Pct
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "i-004ede57a842280fe" --document-name "AWS-RunShellScript" --parameters commands="[\"cd /home/ec2-user/project-intelligent\",\"python3 src/ingestion/j02_delivery_pct_daily.py\"]" --timeout-seconds 900 --region ap-south-1 --query "Command.CommandId" --output text)
          
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "Command Succeeded."
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardOutputContent" --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "DeliveryTimedOut" || "$STATUS" == "ExecutionTimedOut" ]]; then
              echo "Command Failed with status: $STATUS"
              echo "--- STDERR ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardErrorContent" --output text
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardOutputContent" --output text
              exit 1
            fi
            echo "Command is $STATUS... waiting 15 seconds"
            sleep 15
          done

      - name: J09 - Finnhub Sentiment
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "i-004ede57a842280fe" --document-name "AWS-RunShellScript" --parameters commands="[\"cd /home/ec2-user/project-intelligent\",\"python3 src/ingestion/j09_sentiment_daily.py\"]" --timeout-seconds 900 --region ap-south-1 --query "Command.CommandId" --output text)
          
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "Command Succeeded."
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardOutputContent" --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "DeliveryTimedOut" || "$STATUS" == "ExecutionTimedOut" ]]; then
              echo "Command Failed with status: $STATUS"
              echo "--- STDERR ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardErrorContent" --output text
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-004ede57a842280fe" --region ap-south-1 --query "StandardOutputContent" --output text
              exit 1
            fi
            echo "Command is $STATUS... waiting 15 seconds"
            sleep 15
          done

  silver_gold_processing:
    name: Run Silver & Gold Layers (Node B - t3a.xlarge)
    needs: bronze_ingestion
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Start Heavy Node B
        run: |
          aws ec2 start-instances --instance-ids i-0039eff1ed9cbe313 --region ap-south-1
          aws ec2 wait instance-running --instance-ids i-0039eff1ed9cbe313 --region ap-south-1
          sleep 15
          
      - name: Install Python Dependencies on Node B
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "i-0039eff1ed9cbe313" --document-name "AWS-RunShellScript" --parameters commands="[\"sudo yum install -y git python3.11 python3.11-pip\",\"if [ ! -d '/home/ec2-user/project-intelligent' ]; then git clone https://github.com/biteberry/project-intelligent.git /home/ec2-user/project-intelligent; fi\",\"cd /home/ec2-user/project-intelligent\",\"git fetch origin main\",\"git reset --hard origin/main\",\"python3.11 -m pip install --upgrade pip wheel setuptools\",\"pip3.11 install --user --only-binary :all: -r requirements_heavy.txt\"]" --timeout-seconds 900 --region ap-south-1 --query "Command.CommandId" --output text)
          
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "Installation Succeeded."
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardOutputContent" --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "DeliveryTimedOut" || "$STATUS" == "ExecutionTimedOut" ]]; then
              echo "Installation Failed with status: $STATUS"
              echo "--- STDERR ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardErrorContent" --output text
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardOutputContent" --output text
              exit 1
            fi
            echo "Installing Dependencies... Status: $STATUS"
            # Print partial logs to simulate live logging
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardOutputContent" --output text
            sleep 15
          done

      - name: J11 - Silver Transformation
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "i-0039eff1ed9cbe313" --document-name "AWS-RunShellScript" --parameters commands="[\"cd /home/ec2-user/project-intelligent\",\"python3.11 src/silver/j11_silver_transformation.py\"]" --timeout-seconds 900 --region ap-south-1 --query "Command.CommandId" --output text)
          
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then
              echo "Command Succeeded."
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardOutputContent" --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "DeliveryTimedOut" || "$STATUS" == "ExecutionTimedOut" ]]; then
              echo "Command Failed with status: $STATUS"
              echo "--- STDERR ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardErrorContent" --output text
              echo "--- STDOUT ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardOutputContent" --output text
              exit 1
            fi
            echo "Running J11... Status: $STATUS"
            # Print partial logs to simulate live logging
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "i-0039eff1ed9cbe313" --region ap-south-1 --query "StandardOutputContent" --output text
            sleep 15
          done

      - name: Stop Heavy Node B
        if: always()
        run: |
          aws ec2 stop-instances --instance-ids i-0039eff1ed9cbe313 --region ap-south-1
