name: Weekly Batch Ingestion (J03, J04, J05)

on:
  # Run automatically every Saturday at 8:00 AM UTC (1:30 PM IST)
  schedule:
    - cron: '0 8 * * 6'
    
  # Allow manual trigger
  workflow_dispatch:

jobs:
  run-weekly-batch:
    name: Run Weekly Batch (J03, J04, J05) on EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Execute Pipeline via AWS SSM
        run: |
          # Dispatch the SSM Command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-004ede57a842280fe" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"set -e\",
              \"cd /home/ec2-user/project-intelligent\",
              \"git fetch origin main\",
              \"git reset --hard origin/main\",
              \"pip3 install --user -r requirements.txt\",
              \"pip3 install --user beautifulsoup4 requests\",
              \"echo 'Starting J03 (Fundamentals)'\",
              \"python3 src/ingestion/j03_fundamentals_quarterly.py\",
              \"echo 'Starting J04 (Corporate Actions)'\",
              \"python3 src/ingestion/j04_corporate_actions_weekly.py\",
              \"echo 'Starting J05 (India Macro)'\",
              \"python3 src/ingestion/j05_macro_weekly.py\",
              \"echo 'Starting J06 (Earnings Calendar)'\",
              \"python3 src/ingestion/j06_earnings_calendar_weekly.py\",
              \"echo 'Starting J07 (Macro Events Reference)'\",
              \"python3 src/ingestion/j07_macro_events_reference.py\",
              \"echo 'Starting J08 (NSE Circuit Bands)'\",
              \"python3 src/ingestion/j08_circuit_bands_weekly.py\"
            ]" \
            --timeout-seconds 900 \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
            
          echo "Dispatched SSM Command: $COMMAND_ID"
          
          # Wait for the command to finish executing
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-004ede57a842280fe" \
            --region ap-south-1
            
          # Fetch the final status to ensure it passed
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-004ede57a842280fe" \
            --region ap-south-1 \
            --query "Status" \
            --output text)
            
          if [ "$STATUS" != "Success" ]; then
            echo "Pipeline failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-004ede57a842280fe" \
              --region ap-south-1 \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          
          echo "Pipeline executed successfully!"
